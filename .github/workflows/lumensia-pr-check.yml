name: Lumensia PR safety gate

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: write

concurrency:
  group: lumensia-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Run deterministic safety checks
        run: >-
          node scripts/lumensia-pr-check.mjs
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  scene-momentum-patch-once:
    name: Scene Momentum one-shot patch
    if: github.event.pull_request.head.ref == 'codex/scene-momentum-recovery-hf1'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Scene Momentum PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract and run the one-shot patch script
        shell: bash
        run: |
          set -euo pipefail
          awk 'BEGIN{f=0} /python3 - <<'"'"'PY'"'"'/{f=1;next} f && /^          PY$/{exit} f{sub(/^          /,"");print}' .github/workflows/scene-momentum-recovery-patch-once.yml > /tmp/scene-momentum-patch.py
          test -s /tmp/scene-momentum-patch.py
          python3 /tmp/scene-momentum-patch.py

      - name: Validate focused Scene Momentum files
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/scene-momentum.js
          node --check api/lib/context-router.js
          node --check api/chat-router.js
          node --check api/health.js
          node --check app-runtime.js
          node scripts/tests/scene-momentum-v156-hf1.test.mjs
          node scripts/tests/scene-momentum-v156-hf1-integration.test.mjs
          test "$(grep -o 'coreHandler(' api/chat-router.js | wc -l)" -eq 1

      - name: Commit Scene Momentum production integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/scene-momentum.js api/lib/context-router.js api/chat-router.js api/health.js app-runtime.js scripts/tests/scene-momentum-v156-hf1.test.mjs scripts/tests/scene-momentum-v156-hf1-integration.test.mjs
          if git diff --cached --quiet; then
            echo 'Scene Momentum production wiring already present.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'fix: restore Scene Momentum in V1.5.6'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
