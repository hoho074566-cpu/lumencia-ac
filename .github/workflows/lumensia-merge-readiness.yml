name: Lumensia Merge Readiness

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ['Lumensia PR safety gate']
    types: [requested, in_progress, completed]
  check_run:
    types: [created, rerequested, completed]
  status:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: read
  statuses: read
  deployments: read

jobs:
  discover:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'status' ||
      github.event_name == 'workflow_run' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'check_run' && !startsWith(github.event.check_run.name, 'Lumensia Merge Readiness') && github.event.check_run.pull_requests[0].number == null)
    runs-on: ubuntu-latest
    outputs:
      pulls: ${{ steps.list.outputs.result }}
      has_pulls: ${{ steps.list.outputs.has_pulls }}
    steps:
      - name: List open pull request numbers
        id: list
        uses: actions/github-script@v7
        with:
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            });
            core.setOutput('has_pulls', pulls.data.length > 0 ? 'true' : 'false');
            return pulls.data.map((pull) => pull.number);

  evaluate-scan:
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.has_pulls == 'true'
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.pulls) }}
      max-parallel: 10
    concurrency:
      group: lumensia-readiness-pr-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch evaluator only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/lumensia-merge-readiness.mjs
          sparse-checkout-cone-mode: false
      - name: Detect trusted evaluator bootstrap state
        id: evaluator
        shell: bash
        run: |
          if [[ -f scripts/lumensia-merge-readiness.mjs ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Merge Readiness bootstrap: trusted evaluator is not on default branch yet; it will become active after this PR is merged."
          fi
      - name: Set up Node.js 22
        if: steps.evaluator.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Evaluate current PR head and notify on transitions
        if: steps.evaluator.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CODEX_ACTORS: ${{ vars.CODEX_REVIEW_ACTORS }},chatgpt-codex-connector[bot],chatgpt-codex-connector
          REQUIRED_CHECKS: ${{ vars.LUMENSIA_REQUIRED_CHECKS }}
        run: node scripts/lumensia-merge-readiness.mjs

  evaluate-pr:
    if: >-
      (github.event.pull_request.number != null || github.event.check_run.pull_requests[0].number != null || (github.event.issue.pull_request != null && github.event.issue.number != null)) &&
      (github.event_name != 'check_run' || !startsWith(github.event.check_run.name, 'Lumensia Merge Readiness')) &&
      (github.event_name != 'issue_comment' || github.actor == 'chatgpt-codex-connector[bot]' || github.actor == 'chatgpt-codex-connector')
    concurrency:
      group: lumensia-readiness-pr-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}${{ github.event.issue.number || '' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch evaluator only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/lumensia-merge-readiness.mjs
          sparse-checkout-cone-mode: false
      - name: Detect trusted evaluator bootstrap state
        id: evaluator
        shell: bash
        run: |
          if [[ -f scripts/lumensia-merge-readiness.mjs ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Merge Readiness bootstrap: trusted evaluator is not on default branch yet; it will become active after this PR is merged."
          fi
      - name: Set up Node.js 22
        if: steps.evaluator.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Evaluate current PR head and notify on transitions
        if: steps.evaluator.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.check_run.pull_requests[0].number }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CODEX_ACTORS: ${{ vars.CODEX_REVIEW_ACTORS }},chatgpt-codex-connector[bot],chatgpt-codex-connector
          REQUIRED_CHECKS: ${{ vars.LUMENSIA_REQUIRED_CHECKS }}
        run: node scripts/lumensia-merge-readiness.mjs

  maintain-after-pr:
    needs: evaluate-pr
    if: always() && needs.evaluate-pr.result == 'success'
    concurrency:
      group: lumensia-auto-pr-scan
      cancel-in-progress: false
    environment: lumensia-trusted-auto-pr
    permissions:
      contents: write
      checks: read
      statuses: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch maintenance only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/lumensia-auto-pr.mjs
            scripts/lumensia-auto-maintenance.mjs
            scripts/lumensia-auto-maintenance-run.mjs
            scripts/lumensia-merge-readiness.mjs
          sparse-checkout-cone-mode: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Verify trusted maintenance token
        env:
          LUMENSIA_PR_CREATOR_TOKEN: ${{ secrets.LUMENSIA_PR_CREATOR_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$LUMENSIA_PR_CREATOR_TOKEN" ]]; then
            echo "::error::LUMENSIA_PR_CREATOR_TOKEN is unavailable to direct maintenance."
            exit 1
          fi
      - name: Maintain Auto-PRs and conditionally auto-merge
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          LUMENSIA_PR_CREATOR_TOKEN: ${{ secrets.LUMENSIA_PR_CREATOR_TOKEN }}
          LUMENSIA_AUTO_MERGE_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CODEX_ACTORS: ${{ vars.CODEX_REVIEW_ACTORS }}
          REQUIRED_CHECKS: ${{ vars.LUMENSIA_REQUIRED_CHECKS }}
        shell: bash
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/lumensia-maintenance.log"
          : > "$LOG"
          node scripts/lumensia-auto-maintenance-run.mjs 2>&1 | tee -a "$LOG"
          sleep 5
          echo "--- direct maintenance revalidation ---" | tee -a "$LOG"
          node scripts/lumensia-auto-maintenance-run.mjs 2>&1 | tee -a "$LOG"
      - name: Publish direct maintenance status
        if: always()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.check_run.pull_requests[0].number }}
          LOG_PATH: ${{ runner.temp }}/lumensia-maintenance.log
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const number = Number(process.env.PR_NUMBER || 0);
            if (!number) return;
            const marker = '<!-- lumensia-auto-maintenance-status:v1 -->';
            let log = 'Maintenance runner did not produce a log.';
            try { log = fs.readFileSync(process.env.LOG_PATH, 'utf8').trim() || log; } catch {}
            const safeLog = log.replace(/```/g, "''' ").slice(-3500);
            const body = `${marker}\n## Lumensia Auto Maintenance\n\nLatest trusted direct-maintenance execution:\n\n\`\`\`text\n${safeLog}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && String(comment.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: number, body });
            }
