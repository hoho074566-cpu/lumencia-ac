name: Lumensia Merge Readiness

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ['Lumensia PR safety gate']
    types: [completed]
  check_run:
    types: [completed]
  status:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: read
  statuses: read
  deployments: read

concurrency:
  group: lumensia-readiness-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number || 'all-open-prs' }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name != 'check_run' || github.event.check_run.name != 'Lumensia Merge Readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch evaluator only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/lumensia-merge-readiness.mjs
          sparse-checkout-cone-mode: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Evaluate current PR head and notify on transitions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CODEX_ACTORS: ${{ vars.CODEX_REVIEW_ACTORS }}
          REQUIRED_CHECKS: ${{ vars.LUMENSIA_REQUIRED_CHECKS }}
        run: node scripts/lumensia-merge-readiness.mjs
